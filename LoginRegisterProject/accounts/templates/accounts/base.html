<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Authentication{% endblock %}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .auth-container {
            background: white;
            width: 100%;
            max-width: 480px;
            padding: 45px;
            border-radius: 2px;
        }

        h2 {
            font-size: 26px;
            color: #222;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #718096;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            font-size: 12px;
            color: #333;
            margin-bottom: 7px;
        }

        .form-input {
            width: 100%;
            height: 42px;
            padding: 10px;
            border: 1px solid #cbdcf0;
            background: #f8fbff;
            border-radius: 3px;
            font-size: 12px;
            outline: none;
        }

        .form-input:focus {
            border-color: #709bd1;
        }

        .form-input::placeholder {
            color: #8294aa;
        }

        .form-help {
            font-size: 10px;
            color: #718096;
            margin-top: 5px;
        }

        .btn {
            width: 100%;
            padding: 13px;
            background: #222;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 13px;
            margin-top: 10px;
        }

        .btn:hover {
            background: #444;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            margin-bottom: 20px;
        }

        .options label {
            display: flex;
            align-items: center;
            gap: 5px;
            margin: 0;
        }

        a {
            color: #333;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .bottom-text {
            text-align: center;
            font-size: 12px;
            margin-top: 22px;
            color: #333;
        }

        .bottom-text p {
            margin-top: 10px;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 7px;
            font-size: 11px;
            margin: 15px 0;
        }

        .terms input {
            margin-top: 2px;
        }

        .errorlist {
            color: #d93025;
            font-size: 11px;
            list-style: none;
            margin-top: 5px;
        }

        .messages {
            font-size: 12px;
            margin-bottom: 15px;
            color: #287a43;
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 30px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="auth-container">

        {% if messages %}
            {% for message in messages %}
                <div class="messages">{{ message }}</div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}

    </div>

</body>
</html>
